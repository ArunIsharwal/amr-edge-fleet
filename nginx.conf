user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;

        # Health check
        location /health {
            add_header Content-Type application/json;
            add_header 'Access-Control-Allow-Origin' '*' always;
            return 200 '{"status":"ok","gateway":"active"}';
        }

        # Dynamic reverse proxy for Go Nodes 8081-8090 (REST & ConnectRPC Streaming)
        location ~ ^/node/(808[1-9]|8090)/(.*)$ {
            proxy_pass http://127.0.0.1:$1/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Crucial for ConnectRPC streaming (disable buffering & long timeout)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Hide backend CORS headers so Nginx sends clean single CORS headers
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Expose-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' '*' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Connect-Accept-Encoding,Connect-Content-Encoding' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }
    }
}
